name: NIFTYBEES monitor

on:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a run right now (bypasses time-of-day checks, sends a real test push)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance beautifulsoup4 lxml

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGES_URL: https://gatslak.github.io/niftybees-app/
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
        run: python niftybees_monitor.py

      - name: Commit updated state
        id: commit
        run: |
          git config user.name "niftybees-monitor-bot"
          git config user.email "actions@github.com"
          git add monitor_state.json premarket_log.csv preopen_today.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update monitor state [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr cache for preopen snapshot
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -s "https://purge.jsdelivr.net/gh/gatslak/niftybees-app@main/preopen_today.json" || true
